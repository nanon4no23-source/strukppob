name: Build Android APK (Editor Struk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Locate & Prepare Project Files
        run: |
          echo "Memeriksa direktori berkas proyek..."
          ls -la

          # Jika ada berkas ZIP di repo, ekstrak secara otomatis!
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Ditemukan berkas ZIP: $ZIP_FILE. Mengekstrak otomatis..."
            unzip -o "$ZIP_FILE"
          fi

          # Cari letak package.json
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "::error::File package.json tidak ditemukan! Pastikan file ZIP atau file proyek ada di repo ini."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Proyek terdeteksi di direktori: $PROJECT_DIR"
          if [ "$PROJECT_DIR" != "." ]; then
            echo "Memindahkan berkas dari $PROJECT_DIR ke direktori utama..."
            shopt -s dotglob
            cp -r "$PROJECT_DIR"/* .
            shopt -u dotglob
          fi

          echo "Daftar berkas setelah diekstrak:"
          ls -la

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npx vite build

      - name: Setup Capacitor Android
        run: |
          npm install --save-dev --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Editor Struk" "com.editorstruk.app" --web-dir dist || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Android Bluetooth Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Clarity
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Editor-Struk-v1.0.apk || cp android/app/build/outputs/apk/debug/*.apk output-apk/Editor-Struk.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Editor-Struk-APK
          path: output-apk/*.apk
          retention-days: 30
