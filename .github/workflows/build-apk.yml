name: Build Android APK (Editor Struk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Locate & Prepare Project Files
        run: |
          echo "Memeriksa direktori berkas proyek..."
          ls -la

          # Jika pengguna mengunggah berkas zip langsung ke GitHub, ekstrak otomatis
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Ditemukan berkas ZIP: $ZIP_FILE. Mengekstrak otomatis..."
            unzip -o "$ZIP_FILE"
          fi

          # Cari letak package.json
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "::error::File package.json tidak ditemukan! Pastikan file ZIP atau file proyek ada di repo ini."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Proyek terdeteksi di direktori: $PROJECT_DIR"
          if [ "$PROJECT_DIR" != "." ]; then
            echo "Memindahkan berkas dari $PROJECT_DIR ke direktori utama..."
            shopt -s dotglob
            cp -r "$PROJECT_DIR"/* .
            shopt -u dotglob
          fi

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npx vite build

      - name: Setup Capacitor 6 (Stable LTS)
        run: |
          npm install --save-dev --legacy-peer-deps @capacitor/core@^6.1.0 @capacitor/cli@^6.1.0 @capacitor/android@^6.1.0
          npx cap init "Editor Struk" "com.editorstruk.app" --web-dir dist || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Android SDK Environment & Permissions
        run: |
          # Buat local.properties mengarah ke Android SDK runner
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # Inject Permissions Bluetooth & Printer Thermal
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi

      - name: Accept Android Licenses & Ensure Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x ./android/gradlew

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          APK_FOUND=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            cp "$APK_FOUND" output-apk/Editor-Struk-v1.0.apk
            echo "APK siap di: output-apk/Editor-Struk-v1.0.apk"
          else
            echo "::error::File APK tidak ditemukan di direktori output Gradle!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Editor-Struk-APK
          path: output-apk/Editor-Struk-v1.0.apk
          retention-days: 30
